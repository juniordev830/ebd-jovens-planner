name: Laravel lesson archive
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/laravel-lesson-archive']
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ebd_test
          POSTGRES_USER: ebd_test
          POSTGRES_PASSWORD: ci_only_ephemeral_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ebd_test -d ebd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'ebd_test' }}
      DB_HOST: 127.0.0.1
      DB_USERNAME: ebd_test
      DB_PASSWORD: ci_only_ephemeral_password
      CACHE_STORE: array
    defaults:
      run:
        working-directory: laravel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, pdo_pgsql
          tools: composer:v2
          coverage: none
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: php artisan route:list --json
      - run: php artisan test --fail-on-warning
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: composer install --working-dir=laravel --no-interaction --prefer-dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
